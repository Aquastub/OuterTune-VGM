name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - canary
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup CMake
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1"

      - name: Initialize VGM submodules
        run: |
          cd app/src/main/cpp
          bash init_submodules.sh
          git submodule update --init --recursive

      - name: Apply VGM patches
        run: |
          cd app/src/main/cpp
          bash prepare_libvgm_source.sh
          bash prepare_libkss_source.sh

      - name: Build debug APK and run jvm tests
        run: ./gradlew assembleCoreDebug lintCoreDebug testCoreDebugUnitTest --stacktrace -DskipFormatKtlint

      - name: Verify VGM native library
        run: |
          if unzip -l app/build/outputs/apk/core/debug/*.apk | grep -q "libvgmplayer.so"; then
            echo "✅ VGM native library found in APK"
            unzip -l app/build/outputs/apk/core/debug/*.apk | grep libvgmplayer
          else
            echo "⚠️ VGM native library not found in APK"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/build/outputs/apk/core/debug/*.apk
